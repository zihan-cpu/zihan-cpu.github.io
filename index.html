<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tetris · Neon</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at top, #1a0b3d 0%, #0a0420 50%, #000 100%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    overflow: hidden;
  }
  h1 {
    font-size: 2em;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255,0,255,0.5);
    margin-bottom: 12px;
  }
  .game-wrap {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .board-wrap {
    position: relative;
    border: 2px solid #ff00ff;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(255,0,255,0.4), inset 0 0 20px rgba(0,255,255,0.1);
    background: rgba(0,0,0,0.6);
  }
  canvas#board { display: block; border-radius: 6px; }
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 100px;
  }
  .panel {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(0,255,255,0.3);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .panel-label { font-size: 0.7em; opacity: 0.7; letter-spacing: 2px; margin-bottom: 4px; }
  .panel-value {
    font-size: 1.5em; font-weight: 800; color: #00ffff;
    text-shadow: 0 0 10px #00ffff;
  }
  canvas.preview { display:block; margin: 0 auto; }
  .controls {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(3, 70px);
    grid-template-rows: 70px 70px;
    gap: 8px;
  }
  /* iPad / 大屏:把控制按钮固定到屏幕左右下角,拇指够得着 */
  @media (min-width: 820px) {
    .controls {
      display: contents; /* 子按钮自由定位 */
    }
    .ctrl-btn {
      position: fixed;
      width: 78px; height: 78px;
      z-index: 30;
      backdrop-filter: blur(6px);
      background: rgba(0,255,255,0.12) !important;
      border: 2px solid rgba(0,255,255,0.5) !important;
      box-shadow: 0 0 20px rgba(0,255,255,0.2);
    }
    /* 左手 D-pad — 屏幕左下 */
    #btn-left   { left: 30px;  bottom: 100px; }
    #btn-down   { left: 118px; bottom: 30px;  }
    #btn-right  { left: 206px; bottom: 100px; }
    /* 右手动作 — 屏幕右下 */
    #btn-rotate { right: 130px; bottom: 110px; width:90px; height:90px; font-size:2em; }
    #btn-drop   {
      right: 30px; bottom: 30px;
      width: 130px; height: 130px;
      font-size: 1.3em !important;
      background: rgba(255,0,255,0.25) !important;
      border-color: #ff00ff !important;
      box-shadow: 0 0 30px rgba(255,0,255,0.5) !important;
      border-radius: 50% !important;
    }
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(0,255,255,0.4);
    border-radius: 12px;
    color: #fff;
    font-size: 1.6em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.1s;
    display:flex;align-items:center;justify-content:center;
    font-family: inherit;
  }
  .ctrl-btn:active {
    background: rgba(0,255,255,0.3);
    transform: scale(0.95);
    box-shadow: 0 0 15px #00ffff;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    font-size: 1.8em;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #00ffff, #ff00ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .overlay button {
    padding: 12px 24px;
    background: linear-gradient(90deg, #00ffff, #ff00ff);
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 1em;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 0 20px rgba(255,0,255,0.5);
    font-family: inherit;
  }
  .hint { font-size: 0.75em; opacity: 0.6; margin-top: 12px; text-align: center; }
  @media (max-width: 480px) {
    h1 { font-size: 1.5em; }
    .sidebar { min-width: 80px; }
    .panel-value { font-size: 1.2em; }
  }
</style>
</head>
<body>

<div style="display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;">
  <h1 style="margin:0;">TETRIS</h1>
  <button id="btn-music" style="padding:6px 12px;background:rgba(0,255,255,0.15);border:1px solid #00ffff;color:#fff;border-radius:8px;font-family:inherit;cursor:pointer;font-size:0.85em;">🔊</button>
  <button id="btn-shop" style="padding:6px 12px;background:rgba(255,226,89,0.15);border:1px solid #ffe259;color:#fff;border-radius:8px;font-family:inherit;cursor:pointer;font-size:0.85em;font-weight:700;">🛒 商店</button>
</div>

<div class="game-wrap">
  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">READY?</h2>
      <div id="overlay-text" style="opacity:0.85;margin-bottom:8px;"></div>
      <button id="overlay-btn">START</button>
    </div>
  </div>
  <div class="sidebar">
    <div class="panel"><div class="panel-label">SCORE</div><div class="panel-value" id="score">0</div></div>
    <div class="panel"><div class="panel-label">🏆 HIGH</div><div class="panel-value" id="high" style="color:#ffe259;text-shadow:0 0 10px #ffa751;">0</div></div>
    <div class="panel"><div class="panel-label">💰 COINS</div><div class="panel-value" id="coins" style="color:#ffe259;text-shadow:0 0 10px #ffa751;">0</div></div>
    <div class="panel"><div class="panel-label">LEVEL</div><div class="panel-value" id="level">1</div></div>
    <div class="panel"><div class="panel-label">LINES</div><div class="panel-value" id="lines">0</div></div>
    <div class="panel"><div class="panel-label">NEXT</div><canvas id="next" width="80" height="80"></canvas></div>
  </div>
</div>

<div class="controls">
  <div></div>
  <button class="ctrl-btn" id="btn-rotate">↻</button>
  <button class="ctrl-btn" id="btn-drop" style="background:rgba(255,0,255,0.2);border-color:#ff00ff;font-size:1em;">DROP</button>
  <button class="ctrl-btn" id="btn-left">←</button>
  <button class="ctrl-btn" id="btn-down">↓</button>
  <button class="ctrl-btn" id="btn-right">→</button>
</div>

<div class="hint">键盘:← → ↓ 移动 · ↑ 旋转 · 空格 硬降 · P 暂停 · M 静音</div>
<div style="display:flex;gap:8px;margin-top:10px;">
</div>

<div id="items-bar" style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center;min-height:40px;"></div>

<!-- SHOP MODAL -->
<div id="shop-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;overflow-y:auto;padding:20px;">
  <div style="max-width:600px;margin:0 auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <button id="btn-shop-close" style="padding:8px 14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;font-family:inherit;cursor:pointer;">← 返回</button>
      <h2 style="background:linear-gradient(90deg,#ffe259,#ffa751);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:1.5em;letter-spacing:3px;">🛒 SHOP</h2>
      <div style="font-weight:800;color:#ffe259;font-size:1.1em;">💰 <span id="shop-total">0</span></div>
    </div>
    <div style="opacity:0.7;font-size:0.85em;margin-bottom:12px;text-align:center;">永久装备买一次永远拥有 · 消耗品每局开始自动给</div>
    <div id="shop-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;"></div>
  </div>
</div>

<script>
const COLS = 10, ROWS = 20;
const COLORS = {
  I: "#00ffff", O: "#ffff00", T: "#ff00ff",
  S: "#00ff00", Z: "#ff0044", L: "#ff8800", J: "#0088ff"
};
const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  L: [[0,0,1],[1,1,1]],
  J: [[1,0,0],[1,1,1]],
};

const board = document.getElementById("board");
const ctx = board.getContext("2d");
const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");

let CELL = 28;
function sizeBoard() {
  // Tighter reserved space — iPad 上让棋盘更大
  const isLarge = window.innerWidth >= 820;
  const reservedH = isLarge ? 200 : 320;
  const reservedW = isLarge ? 280 : 130;
  const availH = window.innerHeight - reservedH;
  const availW = window.innerWidth - reservedW;
  const cellH = Math.floor(availH / ROWS);
  const cellW = Math.floor(availW / COLS);
  const maxCell = isLarge ? 60 : 40;
  CELL = Math.max(20, Math.min(cellH, cellW, maxCell));
  board.width = CELL * COLS;
  board.height = CELL * ROWS;
}
sizeBoard();
window.addEventListener("resize", () => { sizeBoard(); draw(); });

let grid, current, nextPiece, score, level, lines, gameOver, paused, dropInterval;

function newGrid() { return Array.from({length: ROWS}, () => Array(COLS).fill(null)); }

function randomPiece() {
  const keys = Object.keys(SHAPES);
  let k;
  if (forceRainbow) { k = "I"; forceRainbow = false; }
  else k = keys[Math.floor(Math.random() * keys.length)];
  return {
    type: k,
    shape: SHAPES[k].map(r => r.slice()),
    x: Math.floor((COLS - SHAPES[k][0].length) / 2),
    y: 0,
  };
}

function rotate(shape) {
  const rows = shape.length, cols = shape[0].length;
  const out = Array.from({length: cols}, () => Array(rows).fill(0));
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      out[c][rows - 1 - r] = shape[r][c];
  return out;
}

function collides(piece, dx=0, dy=0, shape=null) {
  const s = shape || piece.shape;
  for (let r = 0; r < s.length; r++) {
    for (let c = 0; c < s[r].length; c++) {
      if (!s[r][c]) continue;
      const nx = piece.x + c + dx;
      const ny = piece.y + r + dy;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && grid[ny][nx]) return true;
    }
  }
  return false;
}

function merge() {
  current.shape.forEach((row, r) => row.forEach((v, c) => {
    if (v) {
      const ny = current.y + r, nx = current.x + c;
      if (ny >= 0) grid[ny][nx] = current.type;
    }
  }));
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r].every(c => c !== null)) {
      grid.splice(r, 1);
      grid.unshift(Array(COLS).fill(null));
      cleared++; r++;
    }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800][cleared] * level;
    score += points;
    lines += cleared;
    // Coins: 10/line, 50 bonus for tetris
    earnCoins(cleared * 10 + (cleared === 4 ? 50 : 0));
    const newLevel = Math.floor(lines / 10) + 1;
    if (newLevel > level) {
      level = newLevel;
      earnCoins(30); // level up bonus
    }
    dropInterval = Math.max(80, 800 - (level - 1) * 60);
    updateUI();
  }
}

function spawn() {
  current = nextPiece || randomPiece();
  nextPiece = randomPiece();
  drawNext();
  if (collides(current)) {
    if (owned.shield && !shieldUsed) {
      shieldUsed = true;
      // Clear top 4 rows
      for (let r = 0; r < 4; r++) grid[r] = Array(COLS).fill(null);
      sfx(1200, 0.3, "square", 0.1);
      return;
    }
    endGame();
  }
}

function tick() {
  if (paused || gameOver) return;
  if (!collides(current, 0, 1)) current.y++;
  else { merge(); clearLines(); spawn(); }
  draw();
}

function move(dx) {
  if (paused || gameOver) return;
  if (!collides(current, dx, 0)) { current.x += dx; draw(); }
}
function softDrop() {
  if (paused || gameOver) return;
  if (!collides(current, 0, 1)) { current.y++; score += 1; updateUI(); draw(); }
  else tick();
}
function hardDrop() {
  if (paused || gameOver) return;
  let d = 0;
  while (!collides(current, 0, d + 1)) d++;
  current.y += d;
  score += d * 2;
  merge(); clearLines(); spawn();
  updateUI(); draw();
}
function rotateCurrent() {
  if (paused || gameOver) return;
  const r = rotate(current.shape);
  for (const k of [0, -1, 1, -2, 2]) {
    if (!collides(current, k, 0, r)) {
      current.shape = r; current.x += k; draw(); return;
    }
  }
}

function draw() {
  ctx.fillStyle = "rgba(10,4,32,0.95)";
  ctx.fillRect(0, 0, board.width, board.height);
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(COLS * CELL, i * CELL); ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) drawCell(ctx, c, r, COLORS[grid[r][c]]);
  if (current && !gameOver) {
    let gd = 0;
    while (!collides(current, 0, gd + 1)) gd++;
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) {
        const x = current.x + c, y = current.y + r + gd;
        ctx.fillStyle = COLORS[current.type] + "30";
        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
      }
    }));
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) drawCell(ctx, current.x + c, current.y + r, COLORS[current.type]);
    }));
  }
}

function drawCell(c2, x, y, color) {
  if (y < 0) return;
  const px = x * CELL, py = y * CELL;
  c2.fillStyle = color;
  c2.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
  c2.fillStyle = "rgba(255,255,255,0.3)";
  c2.fillRect(px + 1, py + 1, CELL - 2, 3);
  c2.fillStyle = "rgba(0,0,0,0.25)";
  c2.fillRect(px + 1, py + CELL - 4, CELL - 2, 3);
}

function drawNext() {
  nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;
  const s = nextPiece.shape;
  const cell = 16;
  const ox = (nextCanvas.width - s[0].length * cell) / 2;
  const oy = (nextCanvas.height - s.length * cell) / 2;
  s.forEach((row, r) => row.forEach((v, c) => {
    if (v) {
      nextCtx.fillStyle = COLORS[nextPiece.type];
      nextCtx.fillRect(ox + c * cell + 1, oy + r * cell + 1, cell - 2, cell - 2);
    }
  }));
}

function updateUI() {
  document.getElementById("score").textContent = score;
  document.getElementById("level").textContent = level;
  document.getElementById("lines").textContent = lines;
  document.getElementById("coins").textContent = totalCoins + roundCoins;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("tetris_high", highScore);
  }
  document.getElementById("high").textContent = highScore;
}
let highScore = parseInt(localStorage.getItem("tetris_high") || "0");

// =========== COIN SYSTEM ===========
let totalCoins = parseInt(localStorage.getItem("tetris_coins") || "0");

// =========== DAILY LOGIN BONUS ===========
function checkDailyBonus() {
  const today = new Date().toDateString();
  const lastLogin = localStorage.getItem("tetris_last_login");
  let streak = parseInt(localStorage.getItem("tetris_streak") || "0");
  if (lastLogin === today) return null; // already claimed today

  // Check if streak continues (yesterday) or resets
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (lastLogin === yesterday) streak++;
  else streak = 1; // reset to day 1

  // Reward by streak day
  const rewards = [50, 80, 120, 180, 250, 350, 500];
  const dayIdx = Math.min(streak - 1, 6);
  const reward = rewards[dayIdx];

  totalCoins += reward;
  localStorage.setItem("tetris_last_login", today);
  localStorage.setItem("tetris_streak", streak);
  return { day: streak, reward, isMax: streak >= 7 };
}

function showDailyPopup(bonus) {
  const popup = document.createElement("div");
  popup.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:20px;
  `;
  const dayLabels = ["第 1 天", "第 2 天", "第 3 天", "第 4 天", "第 5 天", "第 6 天", "第 7 天 🏆"];
  popup.innerHTML = `
    <div style="background:linear-gradient(135deg,#2a1850,#1a0830);border:2px solid #ffe259;border-radius:20px;padding:30px;max-width:340px;text-align:center;box-shadow:0 0 50px rgba(255,226,89,0.5);">
      <div style="font-size:3em;margin-bottom:8px;">🎁</div>
      <h2 style="background:linear-gradient(90deg,#ffe259,#ffa751);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:1.5em;margin-bottom:8px;letter-spacing:2px;">每日登录奖励</h2>
      <div style="opacity:0.85;margin-bottom:16px;">连续登录第 ${bonus.day} 天 ${bonus.isMax ? "🔥" : ""}</div>
      <div style="font-size:2.2em;font-weight:900;color:#ffe259;text-shadow:0 0 20px #ffa751;margin-bottom:16px;">+${bonus.reward} 💰</div>
      <div style="display:flex;gap:4px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;">
        ${[50,80,120,180,250,350,500].map((r, i) => {
          const claimed = i < bonus.day;
          const today = i === bonus.day - 1;
          return `<div style="padding:6px 8px;border-radius:6px;font-size:0.7em;font-weight:700;
            background:${today ? "linear-gradient(90deg,#ffe259,#ffa751)" : (claimed ? "rgba(0,255,136,0.2)" : "rgba(255,255,255,0.05)")};
            color:${today ? "#000" : (claimed ? "#00ff88" : "#fff")};
            border:1px solid ${today ? "#ffe259" : (claimed ? "#00ff88" : "rgba(255,255,255,0.2)")};
            min-width:38px;
            ">D${i+1}<br>${r}</div>`;
        }).join("")}
      </div>
      <button id="daily-close" style="padding:12px 28px;background:linear-gradient(90deg,#00ffff,#ff00ff);color:#000;border:none;border-radius:10px;font-weight:800;font-size:1em;letter-spacing:2px;cursor:pointer;font-family:inherit;">领取</button>
    </div>
  `;
  document.body.appendChild(popup);
  const close = (e) => { if (e) e.preventDefault(); popup.remove(); saveData(); updateUI && updateUI(); };
  popup.querySelector("#daily-close").addEventListener("click", close);
  popup.querySelector("#daily-close").addEventListener("touchend", close);
  // celebratory sound
  setTimeout(() => {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => {
      if (typeof sfx === 'function') sfx(f, 0.2, "square", 0.08);
    }, i * 80));
  }, 200);
}

// Check on page load
setTimeout(() => {
  const bonus = checkDailyBonus();
  if (bonus) showDailyPopup(bonus);
}, 500);
let roundCoins = 0;
let owned = JSON.parse(localStorage.getItem("tetris_owned") || "{}");
let consumables = {}; // per-round consumable counts
function saveData() {
  localStorage.setItem("tetris_coins", totalCoins);
  localStorage.setItem("tetris_owned", JSON.stringify(owned));
}
function earnCoins(n) {
  if (owned.doubleCoin) n *= 2;
  roundCoins += n;
  updateUI();
}

function endGame() {
  gameOver = true;
  // Save earned coins to total
  totalCoins += roundCoins;
  saveData();
  document.getElementById("overlay-title").textContent = "GAME OVER";
  document.getElementById("overlay-text").innerHTML = `Score: ${score} · Lines: ${lines}<br>💰 +${roundCoins} (总:${totalCoins})`;
  document.getElementById("overlay-btn").textContent = "PLAY AGAIN";
  document.getElementById("overlay").classList.remove("hidden");
}

let lastTime = 0;
let accumulator = 0;
function loop(t) {
  if (!lastTime) lastTime = t;
  const dt = t - lastTime;
  lastTime = t;
  if (!paused && !gameOver) {
    accumulator += dt;
    const interval = (Date.now() < slowUntil) ? dropInterval * 2 : dropInterval;
    while (accumulator >= interval) { tick(); accumulator -= interval; }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function start() {
  grid = newGrid();
  score = 0; level = 1; lines = 0;
  gameOver = false; paused = false;
  dropInterval = 800; accumulator = 0; lastTime = 0;
  nextPiece = null;
  roundCoins = 0;
  if (owned.startCoins) roundCoins += 50;
  // Refill consumables from owned items
  consumables = {};
  if (owned.bomb) consumables.bomb = 3;
  if (owned.swap) consumables.swap = 3;

  el.addEventListener("touchcancel", release);

  el.addEventListener("mouseup", release);

}

let audioCtx = null;
let musicEnabled = true;
let musicTimers = [];
let musicPlaying = false;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

const N = {};
(function() {
  const names = ["C","CS","D","DS","E","F","FS","G","GS","A","AS","B"];
  for (let oct = 2; oct <= 6; oct++)
    for (let i = 0; i < 12; i++) {
      const midi = 12 + oct * 12 + i;
      N[names[i] + oct] = 440 * Math.pow(2, (midi - 69) / 12);
    }
  N.REST = 0;
})();

// 8-bit Mario-style bouncy theme (original, C major, fast bouncy)
const MELODY = [
  // Main hook - bouncy
  ["E5",2],["E5",2],["REST",2],["E5",2],["REST",2],["C5",2],["E5",2],["REST",2],
  ["G5",2],["REST",2],["REST",2],["REST",2],["G4",2],["REST",2],["REST",2],["REST",2],
  // Verse
  ["C5",2],["REST",4],["G4",2],["REST",4],["E4",2],["REST",4],
  ["A4",2],["REST",2],["B4",2],["REST",2],["AS4",2],["A4",2],["REST",2],
  ["G4",3],["E5",3],["G5",2],["A5",2],["F5",2],["G5",2],
  ["REST",2],["E5",2],["REST",2],["C5",2],["D5",2],["B4",2],["REST",4],
  // Repeat hook variation
  ["C5",2],["REST",4],["G4",2],["REST",4],["E4",2],["REST",4],
  ["A4",2],["REST",2],["B4",2],["REST",2],["AS4",2],["A4",2],["REST",2],
  ["G4",3],["E5",3],["G5",2],["A5",2],["F5",2],["G5",2],
  ["REST",2],["E5",2],["REST",2],["C5",2],["D5",2],["B4",2],["REST",4],
];
const BASS = [
  ["C3",4],["G2",4],["C3",4],["G2",4],
  ["C3",4],["F2",4],["G2",4],["C3",4],
  ["F3",4],["C3",4],["F3",4],["C3",4],
  ["G3",4],["D3",4],["G3",4],["C3",4],
];

function playNote(freq, t, dur, type, vol) {
  if (!freq) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.01);
  gain.gain.linearRampToValueAtTime(vol * 0.7, t + dur * 0.7);
  gain.gain.linearRampToValueAtTime(0, t + dur);
  osc.start(t); osc.stop(t + dur);
}

function startMusic() {
  if (!musicEnabled || !audioCtx || musicPlaying) return;
  musicPlaying = true;
  scheduleLoop();
}

function scheduleLoop() {
  if (!musicEnabled || !audioCtx) { musicPlaying = false; return; }
  const beat = 0.18;
  const start = audioCtx.currentTime + 0.05;
  let mt = start;
  for (const [n, b] of MELODY) {
    const dur = b * beat;
    if (n !== "REST" && N[n]) playNote(N[n], mt, dur * 0.95, "square", 0.07);
    mt += dur;
  }
  let bt = start;
  for (const [n, b] of BASS) {
    const dur = b * beat;
    if (N[n]) playNote(N[n], bt, dur * 0.95, "triangle", 0.06);
    bt += dur;
  }
  const total = mt - start;
  musicTimers.push(setTimeout(scheduleLoop, total * 1000 - 50));
}

function stopMusic() {
  musicTimers.forEach(t => clearTimeout(t));
  musicTimers = [];
  musicPlaying = false;
}

function toggleMusic() {
  initAudio();
  musicEnabled = !musicEnabled;
  const btn = document.getElementById("btn-music");
  if (musicEnabled) {
    btn.textContent = "🔊 Music: ON";
    if (!gameOver && !paused) startMusic();
  } else {
    btn.textContent = "🔇 Music: OFF";
    stopMusic();
  }
}

document.addEventListener("keydown", e => {

});

// =========== SOUND EFFECTS ===========
function sfx(freq, dur=0.1, type="square", vol=0.08) {
  if (!audioCtx || !musicEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(audioCtx.destination);
  const t = audioCtx.currentTime;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t); osc.stop(t + dur);
}

// Hook sfx into game actions by wrapping originals
const _move = move;
move = function(dx) { const before = current && current.x; _move(dx); if (current && current.x !== before) sfx(330, 0.04, "square", 0.05); };

const _rotate = rotateCurrent;
rotateCurrent = function() { _rotate(); sfx(550, 0.05, "square", 0.06); };

const _hardDrop = hardDrop;
hardDrop = function() {
  _hardDrop();
  // descending sweep
  if (!audioCtx || !musicEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(400, t);
  osc.frequency.exponentialRampToValueAtTime(60, t + 0.15);
  gain.gain.setValueAtTime(0.1, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.18);
};

const _clearLines = clearLines;
clearLines = function() {
  const before = lines;
  _clearLines();
  if (lines > before) {
    const cleared = lines - before;
    if (cleared === 4) {
      // Tetris! special chord
      [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => sfx(f, 0.15, "square", 0.09), i * 60));
    } else {
      sfx(660, 0.1, "square", 0.07);
      setTimeout(() => sfx(880, 0.12, "square", 0.07), 70);
    }
  }
};

const _endGame = endGame;
endGame = function() {

const _draw = draw;
draw = function() {
  ctx.fillStyle = "rgba(10,4,32,0.95)";
  ctx.fillRect(0, 0, board.width, board.height);
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(COLS * CELL, i * CELL); ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) drawCell(ctx, c, r, COLORS[grid[r][c]]);
  if (current && !gameOver) {
    let gd = 0;
    while (!collides(current, 0, gd + 1)) gd++;
    const ghostAlpha = owned.ghost ? "70" : "30";
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) {
        const x = current.x + c, y = current.y + r + gd;
        ctx.fillStyle = COLORS[current.type] + ghostAlpha;
        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
      }
    }));
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) drawCell(ctx, current.x + c, current.y + r, COLORS[current.type]);
    }));
  }
};

  if (bossInterval) { clearInterval(bossInterval); bossInterval = null; }
  document.getElementById("boss-emoji").classList.add("boss-die");
  setTimeout(() => { bossUI.style.display = "none"; document.getElementById("boss-emoji").classList.remove("boss-die","boss-hit"); }, 1200);
  const reward = b.reward * (owned.doubleCoin ? 2 : 1);
  totalCoins += reward;
  saveCoins();
  if (!bossDefeated.includes(bossIndex)) {
    bossDefeated.push(bossIndex);
    localStorage.setItem("bossDefeated", JSON.stringify(bossDefeated));
  }
  let extra = "";
  if (bossIndex === 4) extra = `<br>🏆 <span style="color:#ffd700">魔王征服者称号 GET!</span>`;
  showBossToast(`🎉 击败 ${b.emoji} ${b.name}!<br>+${reward} 💰${extra}`, 3500);
  if (audioCtx) [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => sfx(f, 0.2, "square", 0.1), i * 100));
  bossIndex = Math.min(bossIndex + 1, BOSSES.length - 1);
  linesUntilBoss = 50;
  updateUI();
}

function bossWin() {
  // BOSS 反击
  const b = BOSSES[bossIndex];
  bossActive = false;
  if (bossInterval) { clearInterval(bossInterval); bossInterval = null; }
  bossUI.style.display = "none";
  showBossToast(`💀 ${b.emoji} ${b.name} 反击了!<br><span style="color:#ff5555">棋盘塞满垃圾行</span>`, 2500);
  if (audioCtx) [400, 300, 200, 100].forEach((f, i) => setTimeout(() => sfx(f, 0.3, "sawtooth", 0.12), i * 150));
  // 注入 4 行垃圾
  for (let i = 0; i < 4; i++) injectGarbageRow();
  linesUntilBoss = 50;
}

function injectGarbageRow() {
  if (gameOver) return;
  // 顶行掉了,其它上移一行,最底加一行带洞的垃圾
  for (let r = 0; r < ROWS - 1; r++) {
    grid[r] = grid[r + 1];
  }
  const hole = Math.floor(Math.random() * COLS);
  const row = [];
  for (let c = 0; c < COLS; c++) row.push(c === hole ? 0 : "L");
  grid[ROWS - 1] = row;
  // 检查是否顶到玩家
  draw();
}

// hook clearLines
const _clearLinesBoss = clearLines;
clearLines = function() {
  const before = lines;
  _clearLinesBoss();
  const cleared = lines - before;
  if (cleared > 0) {
    totalLinesAll += cleared;
    localStorage.setItem("totalLinesAll", totalLinesAll);
    if (bossActive) {
      bossDamage(cleared);
    } else {
      linesUntilBoss -= cleared;
      if (linesUntilBoss <= 0) {
        setTimeout(() => startBoss(), 600);
      }
      updateUI();
    }
  }
};

// hook updateUI to show BOSS progress
const _updateUIBoss = updateUI;
updateUI = function() {
  _updateUIBoss();
  // 找一个地方塞 BOSS 进度
  let el = document.getElementById("boss-progress");
  if (!el) {
    el = document.createElement("div");
    el.id = "boss-progress";
    el.style.cssText = "color:#ff66ff;font-size:13px;margin-top:6px;text-align:center;text-shadow:0 0 6px #ff00ff";
    const target = document.querySelector(".side") || document.querySelector(".panel") || document.body;
    target.appendChild(el);
  }
  if (bossActive) {
    el.textContent = "";
  } else {
    const next = BOSSES[bossIndex];
    el.innerHTML = `下个 BOSS: ${next.emoji} ${next.name} · 还差 <b>${Math.max(0,linesUntilBoss)}</b> 行`;
  }
};

// hook endGame to clear boss
const _endGameBoss = endGame;
endGame = function() {
  if (bossActive) {
    bossActive = false;
    if (bossInterval) { clearInterval(bossInterval); bossInterval = null; }
    bossUI.style.display = "none";
  }
  _endGameBoss();
};

// hook startGame reset
if (typeof startGame === "function") {
  const _startGameBoss = startGame;
  startGame = function() {
    bossActive = false;
    if (bossInterval) { clearInterval(bossInterval); bossInterval = null; }
    bossUI.style.display = "none";
    linesUntilBoss = 50;
    _startGameBoss();
    updateUI();
  };
}

// 添加 L 颜色(垃圾行用灰色)
if (typeof COLORS !== "undefined" && !COLORS.L) COLORS.L = "#666666";

// =========== BOSS MASCOT (lurking in corner) ===========
const bossMascot = document.createElement("div");
bossMascot.id = "boss-mascot";
bossMascot.style.cssText = `position:fixed;left:24px;bottom:230px;z-index:5;
  display:none;text-align:center;pointer-events:none;
  filter:drop-shadow(0 0 20px rgba(255,0,255,0.5));`;
bossMascot.innerHTML = `
  <div id="mascot-emoji" style="font-size:140px;line-height:1;animation:mascotFloat 3s ease-in-out infinite"></div>
  <div id="mascot-label" style="color:#ff66ff;font-size:14px;margin-top:8px;text-shadow:0 0 8px #ff00ff;font-weight:bold"></div>
  <div id="mascot-progress" style="margin-top:6px;width:200px;background:rgba(255,0,255,0.15);border:1px solid #ff00ff;border-radius:6px;height:10px;overflow:hidden;margin-left:auto;margin-right:auto">
    <div id="mascot-bar" style="height:100%;background:linear-gradient(90deg,#ff00ff,#00ffff);width:0%;transition:width 0.5s"></div>
  </div>
`;
document.body.appendChild(bossMascot);

const mascotStyle = document.createElement("style");
mascotStyle.textContent = `
  @keyframes mascotFloat {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50%     { transform: translateY(-12px) rotate(5deg); }
  }
  @media (min-width: 820px) { #boss-mascot { display:block !important; } }
`;
document.head.appendChild(mascotStyle);

function updateMascot() {
  if (window.innerWidth < 820) return;
  if (bossActive) { bossMascot.style.display = "none"; return; }
  bossMascot.style.display = "block";
  const next = BOSSES[bossIndex];
  document.getElementById("mascot-emoji").textContent = next.emoji;
  document.getElementById("mascot-label").innerHTML = `下个 BOSS · <span style="color:${next.color}">${next.name}</span><br>还差 ${Math.max(0, linesUntilBoss)} 行`;
  const pct = Math.max(0, Math.min(100, (50 - linesUntilBoss) / 50 * 100));
  document.getElementById("mascot-bar").style.width = pct + "%";
}

const _updateUIMascot = updateUI;
updateUI = function() { _updateUIMascot(); updateMascot(); };

// =========== COMBO + FX PANEL (right empty space) ===========
let comboCount = 0;
let lastClearTime = 0;
let sessionCoins = 0;
let sessionLines = 0;
let sessionStart = Date.now();
let bestCombo = parseInt(localStorage.getItem("bestCombo") || "0");

const fxPanel = document.createElement("div");
fxPanel.id = "fx-panel";
fxPanel.style.cssText = `position:fixed;right:24px;top:200px;z-index:5;
  width:220px;text-align:center;display:none;pointer-events:none;`;
fxPanel.innerHTML = `
  <div style="background:linear-gradient(135deg,rgba(0,255,255,0.1),rgba(255,0,255,0.1));
    border:2px solid rgba(0,255,255,0.4);border-radius:14px;padding:14px;
    backdrop-filter:blur(8px);box-shadow:0 0 20px rgba(0,255,255,0.15)">
    <div style="color:#aaa;font-size:11px;letter-spacing:2px;margin-bottom:6px">COMBO</div>
    <div id="fx-combo" style="font-size:42px;font-weight:900;color:#ff00ff;text-shadow:0 0 15px #ff00ff;line-height:1">×0</div>
    <div style="height:1px;background:rgba(255,255,255,0.1);margin:10px 0"></div>
    <div style="color:#aaa;font-size:10px;letter-spacing:2px">本局 LINES</div>
    <div id="fx-lines" style="font-size:22px;font-weight:800;color:#00ffff;text-shadow:0 0 8px #00ffff">0</div>
    <div style="height:6px"></div>
    <div style="color:#aaa;font-size:10px;letter-spacing:2px">本局 💰</div>
    <div id="fx-coins" style="font-size:22px;font-weight:800;color:#ffe259;text-shadow:0 0 8px #ffe259">0</div>
    <div style="height:6px"></div>
    <div style="color:#aaa;font-size:10px;letter-spacing:2px">PPS · LPM</div>
    <div id="fx-rate" style="font-size:14px;font-weight:700;color:#fff">0.0 · 0</div>
    <div style="height:6px"></div>
    <div style="color:#aaa;font-size:10px;letter-spacing:2px">最高 COMBO</div>
    <div id="fx-best" style="font-size:16px;font-weight:700;color:#ff66ff">×${bestCombo}</div>
  </div>
`;
document.body.appendChild(fxPanel);

const fxStyle = document.createElement("style");
fxStyle.textContent = `
  @media (min-width: 820px) { #fx-panel { display:block !important; } }
  @keyframes fxPop {
    0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    20%  { transform: translate(-50%,-50%) scale(1.3); opacity: 1; }
    60%  { transform: translate(-50%,-50%) scale(1.0); opacity: 1; }
    100% { transform: translate(-50%,-150%) scale(0.8); opacity: 0; }
  }
  @keyframes comboShake {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.4); filter: brightness(2); }
  }
  .fx-pop { animation: fxPop 1.4s ease-out forwards; }
  .combo-shake { animation: comboShake 0.4s ease-out; }
`;
document.head.appendChild(fxStyle);

function popText(html, color = "#ffe259", size = 56) {
  const el = document.createElement("div");
  el.className = "fx-pop";
  el.style.cssText = `position:fixed;left:50%;top:45%;
    color:${color};font-size:${size}px;font-weight:900;
    text-shadow:0 0 20px ${color},0 0 40px ${color};
    z-index:9000;pointer-events:none;font-family:'Press Start 2P',monospace;
    white-space:nowrap;letter-spacing:2px`;
  el.innerHTML = html;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function updateFxPanel() {
  if (window.innerWidth < 820) return;
  document.getElementById("fx-combo").textContent = "×" + comboCount;
  document.getElementById("fx-lines").textContent = sessionLines;
  document.getElementById("fx-coins").textContent = sessionCoins;
  document.getElementById("fx-best").textContent = "×" + bestCombo;
  const elapsedMin = Math.max(0.05, (Date.now() - sessionStart) / 60000);
  const lpm = Math.round(sessionLines / elapsedMin);
  const pps = (sessionLines / (elapsedMin * 60)).toFixed(1);
  document.getElementById("fx-rate").textContent = `${pps} · ${lpm}`;
}
setInterval(updateFxPanel, 500);

// hook clearLines for combo + popups
const _clearLinesFx = clearLines;
clearLines = function() {
  const before = lines;
  const beforeCoins = totalCoins;
  _clearLinesFx();
  const cleared = lines - before;
  if (cleared > 0) {
    sessionLines += cleared;
    const coinsGained = totalCoins - beforeCoins;
    sessionCoins += coinsGained;
    const now = Date.now();
    if (now - lastClearTime < 3500) comboCount++;
    else comboCount = 1;
    lastClearTime = now;
    if (comboCount > bestCombo) {
      bestCombo = comboCount;
      localStorage.setItem("bestCombo", bestCombo);
    }
    // popups
    if (cleared === 4) {
      popText("TETRIS!", "#00ffff", 72);
      setTimeout(() => popText(`+${coinsGained} 💰`, "#ffe259", 44), 250);
    } else if (cleared === 3) {
      popText("TRIPLE!", "#ff00ff", 60);
    } else if (cleared === 2) {
      popText("DOUBLE!", "#ff8800", 50);
    } else {
      popText(`+${coinsGained} 💰`, "#ffe259", 36);
    }
    if (comboCount >= 2) {
      setTimeout(() => popText(`COMBO ×${comboCount}!`, "#ff00ff", 48), 400);
      const fxC = document.getElementById("fx-combo");
      if (fxC) { fxC.classList.remove("combo-shake"); void fxC.offsetWidth; fxC.classList.add("combo-shake"); }
    }
    updateFxPanel();
  }
};

// reset on new game
if (typeof startGame === "function") {
  const _startGameFx = startGame;
  startGame = function() {
    comboCount = 0;
    sessionCoins = 0;
    sessionLines = 0;
    sessionStart = Date.now();
    lastClearTime = 0;
    _startGameFx();
    updateFxPanel();
  };
}

// reset combo on game over
const _endGameFx = endGame;
endGame = function() {
  if (sessionCoins > 0 || sessionLines > 0) {
    setTimeout(() => popText(`本局 +${sessionCoins} 💰`, "#ffe259", 38), 1200);
  }
  comboCount = 0;
  _endGameFx();
};

updateFxPanel();

// Initial state
grid = newGrid();
score = 0; level = 1; lines = 0;
gameOver = true;
draw();
updateUI();
updateMascot();
</script>
</body>
</html>
